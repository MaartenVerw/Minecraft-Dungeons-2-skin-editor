# Builds, tests and publishes MCD2SkinStudio.exe. Runs on version tags (v*), which create a GitHub
# release, or by hand (build artifact only).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # game tests skip themselves: the runner has no Minecraft Dungeons II
      - name: Test
        run: dotnet test tests/Mcd2SkinStudio.Tests -c Release

      - name: Publish
        run: dotnet publish src/Mcd2SkinStudio.App -c Release -o publish

      - name: Hash
        shell: pwsh
        run: |
          $h = (Get-FileHash publish/MCD2SkinStudio.exe -Algorithm SHA256).Hash.ToLower()
          "$h  MCD2SkinStudio.exe" | Out-File -Encoding ascii publish/MCD2SkinStudio.exe.sha256
          Get-Content publish/MCD2SkinStudio.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: MCD2SkinStudio
          path: |
            publish/MCD2SkinStudio.exe
            publish/MCD2SkinStudio.exe.sha256

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" publish/MCD2SkinStudio.exe publish/MCD2SkinStudio.exe.sha256 --title "MCD2 Skin Studio ${{ github.ref_name }}" --generate-notes
